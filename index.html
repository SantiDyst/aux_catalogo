<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catalogos auxiliares</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
    font-size: 14px; color: #1f2733; background: #eef1f5;
    display: flex; height: 100vh; overflow: hidden;
  }
  #lateral {
    width: 268px; flex: 0 0 268px; height: 100vh; overflow-y: auto;
    background: #22303f; color: #d8e0e8; padding: 18px 0 24px 0;
  }
  #lateral h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: #8fa6bb;
    margin: 0 0 4px 0; padding: 0 18px;
  }
  #lateral .sub { font-size: 12px; color: #6c8093; padding: 0 18px 14px 18px; }
  #menu { list-style: none; margin: 0; padding: 0; }
  #menu li {
    padding: 9px 18px 9px 16px; cursor: pointer; font-size: 13.5px;
    border-left: 3px solid transparent; display: flex;
    justify-content: space-between; align-items: center; gap: 8px;
  }
  #menu li:hover { background: #2c3d4f; }
  #menu li.activo {
    background: #2f4356; border-left-color: #58a6ff; color: #fff; font-weight: 600;
  }
  #menu li .n {
    font-size: 11px; color: #7d94a8; font-variant-numeric: tabular-nums;
    background: #1b2733; border-radius: 9px; padding: 1px 7px; flex: 0 0 auto;
  }
  #menu li.activo .n { color: #cfe3f7; background: #40structure; }
  #menu li.activo .n { color: #cfe3f7; background: #40566b; }
  #contenido { flex: 1 1 auto; height: 100vh; overflow-y: auto; padding: 0; }
  #barra {
    position: sticky; top: 0; z-index: 5; background: #fff;
    border-bottom: 1px solid #d5dce4; padding: 12px 22px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  #titulo { font-size: 17px; font-weight: 600; margin: 0; }
  #meta { font-size: 12.5px; color: #61708a; }
  #buscar {
    flex: 1 1 240px; max-width: 380px; margin-left: auto;
    padding: 7px 11px; font-size: 13px; font-family: inherit;
    border: 1px solid #c6d0da; border-radius: 5px; outline: none; background: #f8fafc;
  }
  #buscar:focus { border-color: #58a6ff; background: #fff; }
  #tabla-envoltura { padding: 0 22px 40px 22px; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: 13px; }
  thead th {
    position: sticky; top: 57px; z-index: 4;
    background: #3a4a5c; color: #fff; text-align: left;
    padding: 9px 11px; font-weight: 600; font-size: 12.5px;
    white-space: nowrap; border-right: 1px solid #4a5b6e;
  }
  tbody td {
    padding: 6px 11px; border-bottom: 1px solid #e6ebf0;
    vertical-align: top; border-right: 1px solid #f0f3f7;
  }
  tbody tr:nth-child(even) { background: #f7f9fb; }
  tbody tr:hover { background: #eaf2fc; }
  td.vacio { color: #b3bdc8; }
  #vacio-msg { padding: 3px 0 0 0; color: #61708a; font-size: 13px; }
  .pista { padding: 30px 22px; color: #61708a; }
  #cuenta-filtrada { font-size: 12.5px; color: #61708a; padding: 10px 0 0 2px; }
</style>
</head>

var menu = document.getElementById("menu");
var titulo = document.getElementById("titulo");
var meta = document.getElementById("meta");
var zona = document.getElementById("tabla-zona");
var buscar = document.getElementById("buscar");
var cuentaFiltrada = document.getElementById("cuenta-filtrada");
var actual = -1;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function construirMenu() {
  DATOS.forEach(function (d, i) {
    var li = document.createElement("li");
    li.innerHTML = "<span>" + esc(d.nombre) + "</span><span class=\"n\">" + d.filas.length + "</span>";
    li.onclick = function () { mostrar(i); };
    menu.appendChild(li);
  });
}

function mostrar(i) {
  actual = i;
  var d = DATOS[i];
  var items = menu.getElementsByTagName("li");
  for (var k = 0; k < items.length; k++) items[k].className = (k === i) ? "activo" : "";
  titulo.textContent = d.nombre;
  meta.textContent = d.header.length + " columnas  |  " + d.filas.length + " registros";
  buscar.value = "";
  dibujar(d, "");
}

function dibujar(d, filtro) {
  if (d.filas.length === 0) {
    zona.innerHTML = "<div class=\"pista\">Esta tabla no contiene registros.</div>";
    cuentaFiltrada.textContent = "";
    return;
  }
  var f = filtro.toLowerCase();
  var visibles = [];
  for (var i = 0; i < d.filas.length; i++) {
    if (!f) { visibles.push(i); continue; }
    var fila = d.filas[i];
    for (var j = 0; j < fila.length; j++) {
      if (String(fila[j]).toLowerCase().indexOf(f) !== -1) { visibles.push(i); break; }
    }
  }
  var html = ["<table><thead><tr>"];
  for (var c = 0; c < d.header.length; c++) html.push("<th>" + esc(d.header[c]) + "</th>");
  html.push("</tr></thead><tbody>");
  for (var v = 0; v < visibles.length; v++) {
    var fila = d.filas[visibles[v]];
    html.push("<tr>");
    for (var c2 = 0; c2 < d.header.length; c2++) {
      var val = (fila[c2] === undefined || fila[c2] === "") ? "" : fila[c2];
      html.push(val === "" ? "<td class=\"vacio\"></td>" : "<td>" + esc(val) + "</td>");
    }
    html.push("</tr>");
  }
  html.push("</tbody></table>");
  zona.innerHTML = html.join("");
  if (f) {
    cuentaFiltrada.textContent = visibles.length + " de " + d.filas.length + " registros coinciden con el filtro";
  } else {
    cuentaFiltrada.textContent = "";
  }
}

buscar.oninput = function () {
  if (actual < 0) return;
  dibujar(DATOS[actual], this.value.trim());
};

construirMenu();
if (DATOS.length > 0) mostrar(0);
</script>
